<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>
    <filter id="shadow-sm" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04" />
    </filter>
  </defs>

  <rect width="1280" height="680" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1240" height="640" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Header -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="190" height="24" rx="12" fill="#EFF6FF"/>
    <text x="95" y="16" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="0.8" text-anchor="middle">CRYPTOGRAPHIC SPEC</text>
    <text x="202" y="17" fill="#0F172A" font-size="20" font-weight="700" letter-spacing="-0.3">Two-Phase Cryptographic Human Gate &amp; JWS Evidence</text>
    <text x="202" y="38" fill="#64748B" font-size="13">Decoupling reasoning from write execution via Ed25519 signatures and RFC 7515 tamper-evident receipts</text>
  </g>

  <!-- 4 Stage Columns -->
  <g transform="translate(60, 115)">
    <!-- Stage 1 -->
    <rect width="265" height="420" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-sm)"/>
    <rect x="18" y="18" width="32" height="32" rx="8" fill="#F1F5F9"/>
    <text x="34" y="40" font-size="16" text-anchor="middle">1</text>
    <text x="60" y="30" fill="#0F172A" font-size="15" font-weight="700">Intent Canonicalization</text>
    <text x="60" y="46" fill="#64748B" font-size="11.5">Untrusted Reasoning Plane</text>

    <g transform="translate(16, 75)">
      <rect width="233" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="22" fill="#0F172A" font-size="12" font-weight="600">RFC 8785 JSON Normalization</text>
      <text x="12" y="40" fill="#64748B" font-size="11">Deterministic key sorting</text>
      <text x="12" y="58" fill="#475569" font-size="11" font-family="monospace">args = { "branch": "fix", ... }</text>
      <text x="12" y="76" fill="#2563EB" font-size="11" font-weight="600">Compute SHA-256 Digest</text>

      <rect y="105" width="233" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="127" fill="#0F172A" font-size="12" font-weight="600">Bind Policy Snapshot</text>
      <text x="12" y="145" fill="#64748B" font-size="11">Pins admission policy version</text>
      <text x="12" y="163" fill="#475569" font-size="11" font-family="monospace">policy_hash = 0x8a92f...</text>
      <text x="12" y="181" fill="#16A34A" font-size="11" font-weight="600">Prevents policy drift attacks</text>

      <rect y="210" width="233" height="110" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
      <text x="12" y="232" fill="#1E40AF" font-size="12" font-weight="700">Yields: Digest for Review</text>
      <text x="12" y="254" fill="#2563EB" font-size="11" font-family="monospace">digest = H(Intent ∥ Policy)</text>
      <text x="12" y="274" fill="#64748B" font-size="11">• Zero write tokens given to LLM</text>
      <text x="12" y="294" fill="#64748B" font-size="11">• Inert without human signature</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <line x1="265" y1="210" x2="295" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Stage 2 -->
    <g transform="translate(295, 0)">
      <rect width="265" height="420" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#shadow-sm)"/>
      <rect x="18" y="18" width="32" height="32" rx="8" fill="#EFF6FF"/>
      <text x="34" y="40" font-size="16" text-anchor="middle">2</text>
      <text x="60" y="30" fill="#0F172A" font-size="15" font-weight="700">Cryptographic Sign-off</text>
      <text x="60" y="46" fill="#2563EB" font-size="11.5" font-weight="600">Out-of-Band Human Gate</text>

      <g transform="translate(16, 75)">
        <rect width="233" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="22" fill="#0F172A" font-size="12" font-weight="600">Reviewer Terminal Diff UI</text>
        <text x="12" y="40" fill="#64748B" font-size="11">Inspect code changes &amp; params</text>
        <text x="12" y="58" fill="#475569" font-size="11">Explicit approval of intent digest</text>
        <text x="12" y="76" fill="#16A34A" font-size="11" font-weight="600">✓ No blind pass-through</text>

        <rect y="105" width="233" height="90" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="127" fill="#0F172A" font-size="12" font-weight="600">Ed25519 Signature</text>
        <text x="12" y="145" fill="#64748B" font-size="11">Private key held on operator host</text>
        <text x="12" y="163" fill="#475569" font-size="11" font-family="monospace">sig = Sign_sk(Digest ∥ t)</text>
        <text x="12" y="181" fill="#2563EB" font-size="11" font-weight="600">Tamper-evident verification</text>

        <rect y="210" width="233" height="110" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="12" y="232" fill="#1E40AF" font-size="12" font-weight="700">Yields: Signed Receipt</text>
        <text x="12" y="254" fill="#2563EB" font-size="11" font-family="monospace">Authorization Receipt</text>
        <text x="12" y="274" fill="#64748B" font-size="11">• Bound to approver public key</text>
        <text x="12" y="294" fill="#64748B" font-size="11">• Protected with bounded timestamp</text>
      </g>
    </g>

    <!-- Arrow 2 -> 3 -->
    <line x1="560" y1="210" x2="590" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Stage 3 -->
    <g transform="translate(590, 0)">
      <rect width="265" height="420" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="18" y="18" width="32" height="32" rx="8" fill="#F1F5F9"/>
      <text x="34" y="40" font-size="16" text-anchor="middle">3</text>
      <text x="60" y="30" fill="#0F172A" font-size="15" font-weight="700">Effect Broker Admission</text>
      <text x="60" y="46" fill="#64748B" font-size="11.5">Capability Token Minting</text>

      <g transform="translate(16, 75)">
        <rect width="233" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="22" fill="#0F172A" font-size="12" font-weight="600">Two-Phase: admit()</text>
        <text x="12" y="40" fill="#64748B" font-size="11">Verifies signature &amp; public key</text>
        <text x="12" y="58" fill="#475569" font-size="11">Confirms quotas &amp; tenant policies</text>
        <text x="12" y="76" fill="#16A34A" font-size="11" font-weight="600">✓ Gate admission authorized</text>

        <rect y="105" width="233" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="127" fill="#0F172A" font-size="12" font-weight="600">Capability Token</text>
        <text x="12" y="145" fill="#64748B" font-size="11">TTL = 300s · Single-use only</text>
        <text x="12" y="163" fill="#475569" font-size="11">Scoped to leased worker node</text>
        <text x="12" y="181" fill="#2563EB" font-size="11" font-weight="600">Zero persistent token exposure</text>

        <rect y="210" width="233" height="110" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
        <text x="12" y="232" fill="#1E40AF" font-size="12" font-weight="700">Dispatch: executeAdmitted()</text>
        <text x="12" y="254" fill="#2563EB" font-size="11" font-family="monospace">Disposable Execution</text>
        <text x="12" y="274" fill="#64748B" font-size="11">• Tokens injected in worker plane</text>
        <text x="12" y="294" fill="#64748B" font-size="11">• Credential revoked immediately</text>
      </g>
    </g>

    <!-- Arrow 3 -> 4 -->
    <line x1="855" y1="210" x2="885" y2="210" stroke="#2563EB" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Stage 4 -->
    <g transform="translate(885, 0)">
      <rect width="275" height="420" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadow-sm)"/>
      <rect x="18" y="18" width="32" height="32" rx="8" fill="#F1F5F9"/>
      <text x="34" y="40" font-size="16" text-anchor="middle">4</text>
      <text x="60" y="30" fill="#0F172A" font-size="15" font-weight="700">RFC 7515 JWS Evidence</text>
      <text x="60" y="46" fill="#64748B" font-size="11.5">Tamper-Evident Audit</text>

      <g transform="translate(16, 75)">
        <rect width="243" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="22" fill="#0F172A" font-size="12" font-weight="600">Tamper-Evident JWS Receipt</text>
        <text x="12" y="40" fill="#64748B" font-size="11">Wraps request, response &amp; remote ID</text>
        <text x="12" y="58" fill="#475569" font-size="11">Signed with Ed25519 signature</text>
        <text x="12" y="76" fill="#16A34A" font-size="11" font-weight="600">✓ Non-repudiation guaranteed</text>

        <rect y="105" width="243" height="90" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="12" y="127" fill="#0F172A" font-size="12" font-weight="600">Append-Only Audit Ledger</text>
        <text x="12" y="145" fill="#64748B" font-size="11">Immutable evidence store</text>
        <text x="12" y="163" fill="#475569" font-size="11">Any post-hoc mutation breaks sig</text>
        <text x="12" y="181" fill="#2563EB" font-size="11" font-weight="600">Supports offline compliance audits</text>

        <rect y="210" width="243" height="110" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
        <text x="12" y="232" fill="#166534" font-size="12" font-weight="700">Governance Loop: Compensation</text>
        <text x="12" y="254" fill="#15803D" font-size="11" font-family="monospace">Compensator Capability</text>
        <text x="12" y="274" fill="#475569" font-size="11">• Downstream rollback capability</text>
        <text x="12" y="294" fill="#475569" font-size="11">• Rollback requires separate receipt</text>
      </g>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(60, 560)">
    <rect width="1160" height="70" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="24" y="26" fill="#0F172A" font-size="12.5" font-weight="700">Figure 3 Cryptographic Guarantees:</text>
    <text x="250" y="26" fill="#475569" font-size="12.5">Agent runtimes are strictly sandboxed from write credentials. Human sign-off is not an ephemeral button click,</text>
    <text x="24" y="48" fill="#475569" font-size="12.5">but a verifiable Ed25519 cryptographic signature binding the canonical intent digest to the policy snapshot, producing immutable RFC 7515 JWS receipts.</text>
  </g>
</svg>