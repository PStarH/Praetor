<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" width="1280" height="680" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#2563EB"/>
    </marker>

    <!-- Subtle Drop Shadows -->
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.02" />
    </filter>
    <filter id="active-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.04" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="680" fill="#FFFFFF"/>
  <rect x="20" y="20" width="1240" height="640" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Top Header Banner -->
  <g transform="translate(60, 48)">
    <rect x="0" y="0" width="84" height="24" rx="12" fill="#EFF6FF"/>
    <text x="42" y="16" fill="#2563EB" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">WORKFLOW</text>
    <text x="96" y="17" fill="#0F172A" font-size="20" font-weight="700" letter-spacing="-0.3">Commander High-Level Architecture</text>
    <text x="96" y="38" fill="#64748B" font-size="13">The secure, deterministic control plane between autonomous AI agents and production infrastructure</text>
  </g>

  <!-- 3 MAIN COLUMNS -->

  <!-- ==================== COLUMN 1: UNTRUSTED AGENT ==================== -->
  <g transform="translate(60, 115)">
    <!-- Container Card -->
    <rect width="300" height="400" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="36" y="42" font-size="18" text-anchor="middle">🤖</text>
    <text x="64" y="34" fill="#0F172A" font-size="16" font-weight="700">Untrusted AI Agents</text>
    <text x="64" y="50" fill="#64748B" font-size="12">Autonomous Reasoning Plane</text>

    <!-- Subtitle Tag -->
    <rect x="18" y="70" width="264" height="28" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="150" y="88" fill="#DC2626" font-size="11" font-weight="600" text-anchor="middle">⚠️ Untrusted Runtime · Zero Write Secrets</text>

    <!-- Content Items -->
    <g transform="translate(18, 114)">
      <!-- Item 1 -->
      <rect width="264" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="26" fill="#0F172A" font-size="13" font-weight="600">Model Generates Intent</text>
      <text x="16" y="46" fill="#64748B" font-size="12">Claude, Cursor, AutoGen, Custom LLMs</text>
      
      <!-- Item 2 -->
      <rect y="76" width="264" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="102" fill="#0F172A" font-size="13" font-weight="600">Proposes Actions Only</text>
      <text x="16" y="122" fill="#64748B" font-size="12">Yields candidate branches, zero direct exec</text>

      <!-- Item 3: Key Safety Feature -->
      <rect y="152" width="264" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="178" fill="#0F172A" font-size="13" font-weight="600">🔒 Why It Is Safe</text>
      <text x="16" y="200" fill="#475569" font-size="12">• Context never touches production tokens</text>
      <text x="16" y="222" fill="#475569" font-size="12">• Hallucinated actions cannot mutate infra</text>
    </g>
  </g>

  <!-- Flow Connector 1 -> 2 -->
  <g transform="translate(365, 290)">
    <line x1="0" y1="0" x2="68" y2="0" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="4" y="-22" width="60" height="18" rx="4" fill="#EFF6FF"/>
    <text x="34" y="-10" fill="#2563EB" font-size="10" font-weight="700" text-anchor="middle">Propose</text>
  </g>

  <!-- ==================== COLUMN 2: COMMANDER CONTROL PLANE ==================== -->
  <g transform="translate(440, 115)">
    <!-- Container Card (Active / Primary Highlight) -->
    <rect width="400" height="400" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2" filter="url(#active-shadow)"/>
    
    <!-- Header -->
    <rect x="20" y="18" width="36" height="36" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="38" y="42" font-size="18" text-anchor="middle">🛡️</text>
    <text x="68" y="34" fill="#0F172A" font-size="16" font-weight="700">Commander Control Plane</text>
    <text x="68" y="50" fill="#2563EB" font-size="12" font-weight="600">Deterministic Governance &amp; Recovery</text>

    <!-- Status Pill -->
    <rect x="20" y="70" width="360" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="200" y="88" fill="#16A34A" font-size="11" font-weight="600" text-anchor="middle">Three Gates of Assurance · No Blind Passes</text>

    <!-- 3 Internal Pillars -->
    <g transform="translate(20, 112)">
      <!-- Pillar 1: Preflight -->
      <rect width="360" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="33" r="14" fill="#EFF6FF"/>
      <text x="28" y="38" fill="#2563EB" font-size="12" font-weight="700" text-anchor="middle">1</text>
      <text x="52" y="27" fill="#0F172A" font-size="13" font-weight="700">Preflight Idempotency Gate</text>
      <text x="52" y="47" fill="#64748B" font-size="11.5">Query-before-retry halts duplicate loops and storm retries</text>

      <!-- Pillar 2: Human Sign-off -->
      <rect y="78" width="360" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="111" r="14" fill="#EFF6FF"/>
      <text x="28" y="116" fill="#2563EB" font-size="12" font-weight="700" text-anchor="middle">2</text>
      <text x="52" y="105" fill="#0F172A" font-size="13" font-weight="700">Cryptographic Human Sign-off</text>
      <text x="52" y="125" fill="#64748B" font-size="11.5">High-risk writes require Ed25519 signed approval receipts</text>

      <!-- Pillar 3: Durable Kernel -->
      <rect y="156" width="360" height="66" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
      <circle cx="28" cy="189" r="14" fill="#EFF6FF"/>
      <text x="28" y="194" fill="#2563EB" font-size="12" font-weight="700" text-anchor="middle">3</text>
      <text x="52" y="183" fill="#0F172A" font-size="13" font-weight="700">Durable Kernel &amp; Safe Secrets</text>
      <text x="52" y="203" fill="#64748B" font-size="11.5">Isolated token injection · PostgreSQL WAL self-healing</text>
    </g>

    <!-- Bottom summary tag -->
    <g transform="translate(20, 348)">
      <rect width="360" height="34" rx="8" fill="#F1F5F9"/>
      <text x="180" y="21" fill="#475569" font-size="11.5" font-weight="600" text-anchor="middle">Tamper-evident JWS audit log · Automated cascade compensator</text>
    </g>
  </g>

  <!-- Flow Connector 2 -> 3 -->
  <g transform="translate(845, 290)">
    <line x1="0" y1="0" x2="68" y2="0" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="4" y="-22" width="60" height="18" rx="4" fill="#EFF6FF"/>
    <text x="34" y="-10" fill="#2563EB" font-size="10" font-weight="700" text-anchor="middle">Execute</text>
  </g>

  <!-- ==================== COLUMN 3: TARGET INFRASTRUCTURE ==================== -->
  <g transform="translate(920, 115)">
    <!-- Container Card -->
    <rect width="300" height="400" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" filter="url(#card-shadow)"/>
    
    <!-- Header -->
    <rect x="18" y="18" width="36" height="36" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <text x="36" y="42" font-size="18" text-anchor="middle">🚀</text>
    <text x="64" y="34" fill="#0F172A" font-size="16" font-weight="700">Production Infrastructure</text>
    <text x="64" y="50" fill="#64748B" font-size="12">Target Systems &amp; APIs</text>

    <!-- Subtitle Tag -->
    <rect x="18" y="70" width="264" height="28" rx="6" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <text x="150" y="88" fill="#16A34A" font-size="11" font-weight="600" text-anchor="middle">✅ Deterministic · Exactly-Once Semantics</text>

    <!-- Target Entities -->
    <g transform="translate(18, 114)">
      <!-- Entity 1 -->
      <rect width="264" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="26" fill="#0F172A" font-size="13" font-weight="600">Git Repositories</text>
      <text x="16" y="46" fill="#64748B" font-size="12">GitHub PRs, clean rebases, releases</text>

      <!-- Entity 2 -->
      <rect y="76" width="264" height="64" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="102" fill="#0F172A" font-size="13" font-weight="600">Cloud &amp; Orchestration</text>
      <text x="16" y="122" fill="#64748B" font-size="12">AWS, GCP, Kubernetes rollouts</text>

      <!-- Entity 3 -->
      <rect y="152" width="264" height="96" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <text x="16" y="178" fill="#0F172A" font-size="13" font-weight="600">🛡️ Production Guarantee</text>
      <text x="16" y="200" fill="#475569" font-size="12">• Zero double writes or unreviewed PRs</text>
      <text x="16" y="222" fill="#475569" font-size="12">• Resumes cleanly after process crash</text>
    </g>
  </g>

  <!-- ==================== BOTTOM FEATURE BAR ==================== -->
  <g transform="translate(60, 538)">
    <rect width="1160" height="92" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Highlight 1 -->
    <g transform="translate(30, 22)">
      <circle cx="16" cy="24" r="16" fill="#EFF6FF"/>
      <text x="16" y="30" font-size="14" text-anchor="middle">⚡</text>
      <text x="44" y="20" fill="#0F172A" font-size="13" font-weight="700">Halt Retry Storms</text>
      <text x="44" y="38" fill="#64748B" font-size="11.5">Preflight query halts duplicate retries before cloud APIs</text>
    </g>

    <!-- Divider 1 -->
    <line x1="400" y1="18" x2="400" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Highlight 2 -->
    <g transform="translate(425, 22)">
      <circle cx="16" cy="24" r="16" fill="#EFF6FF"/>
      <text x="16" y="30" font-size="14" text-anchor="middle">🔐</text>
      <text x="44" y="20" fill="#0F172A" font-size="13" font-weight="700">Zero Secret Leaks</text>
      <text x="44" y="38" fill="#64748B" font-size="11.5">Agents never touch write tokens or production keys</text>
    </g>

    <!-- Divider 2 -->
    <line x1="785" y1="18" x2="785" y2="74" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Highlight 3 -->
    <g transform="translate(810, 22)">
      <circle cx="16" cy="24" r="16" fill="#EFF6FF"/>
      <text x="16" y="30" font-size="14" text-anchor="middle">🔄</text>
      <text x="44" y="20" fill="#0F172A" font-size="13" font-weight="700">Crash-Proof WAL Leases</text>
      <text x="44" y="38" fill="#64748B" font-size="11.5">DB state machine auto-resumes; zero dirty writes</text>
    </g>
  </g>
</svg>