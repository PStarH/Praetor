name: Helm Lifecycle

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  pull_request:
  push:
    branches: [main, master]
    paths:
      - 'apps/api/**'
      - 'deploy/helm/commander/**'
      - 'packages/**'
      - 'scripts/**'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - '.github/workflows/helm-lifecycle.yml'

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @praetor/postgres-runtime build
      - run: pnpm exec node --import tsx --test packages/kernel/src/migrationGate.test.ts scripts/chart-content-digest.test.ts scripts/helm-cell-assert.test.ts scripts/helm-post-render-projection.test.ts scripts/helm-release-projection-claim-directory.test.ts scripts/helm-lifecycle-static.test.ts scripts/helm-lifecycle-kind.test.ts
      - run: pnpm exec tsx scripts/chart-content-digest.ts verify deploy/helm/commander
      - run: helm lint deploy/helm/commander -f deploy/helm/commander/values-demo.yaml
      - run: pnpm exec tsx scripts/helm-lifecycle-static.ts

  kind:
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - run: pnpm install --frozen-lockfile
      - name: Build Kind lifecycle runtime packages
        run: |
          pnpm --filter @praetor/postgres-runtime build
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/plugin-sdk build
          pnpm --filter @praetor/effect-broker build
          pnpm --filter @praetor/kernel build
          pnpm --filter @praetor/action-adapters build
          pnpm --filter @praetor/core build
          pnpm --filter @praetor/worker-plane build
      - name: Seed Kind bootstrap evidence
        run: pnpm exec tsx scripts/helm-lifecycle-kind.ts bootstrap-evidence
      - id: provision-kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          cluster_name: commander-helm-lifecycle
          node_image: kindest/node:v1.33.2@sha256:18e6c8f260d51cda4bc32d9f1a4852f9e693c7b667aa14321996ed7c411fc121
          config: scripts/fixtures/helm-lifecycle/kind-config.yaml
      - name: Record Kind provisioning failure
        if: ${{ always() && steps.provision-kind.outcome == 'failure' }}
        run: pnpm exec tsx scripts/helm-lifecycle-kind.ts bootstrap-evidence kind-provisioning
      - name: Seed Kind harness evidence
        if: ${{ success() && steps.provision-kind.outcome == 'success' }}
        run: pnpm exec tsx scripts/helm-lifecycle-kind.ts bootstrap-evidence harness-bootstrap
      - name: Run Kind lifecycle harness
        run: pnpm exec tsx scripts/helm-lifecycle-kind.ts run
      - name: Upload sanitized evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kind-lifecycle-evidence
          path: kind-lifecycle-evidence.json
          if-no-files-found: error
          retention-days: 30
