name: CI

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      run_github_live_proof:
        description: Run GitHub sandbox adapter create, response-cut lookup, and close tests (not Gateway proof)
        required: true
        type: boolean
        default: false
      run_dr_live_proof:
        description: Run the protected G4 rotation and PostgreSQL DR proof
        required: true
        type: boolean
        default: false
      run_github_gateway_live:
        description: Run the real Cell Gateway against the GitHub sandbox repository through a response-cut proxy
        required: true
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  github-launch-contract:
    name: GitHub launch contracts (synthetic HTTP, no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the adapter contract dependencies
        run: |
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/effect-broker build
      - run: pnpm test:github:offline
      - run: pnpm demo:github --help
      - run: pnpm typecheck:github

  github-sandbox-adapter:
    name: GitHub sandbox adapter proof (not Gateway or restart proof)
    if: github.event_name == 'workflow_dispatch' && inputs.run_github_live_proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-sandbox
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build adapter dependencies
        run: |
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/effect-broker build
      - name: Validate exact sandbox configuration before minting a token
        env:
          SANDBOX_OWNER: ${{ vars.COMMANDER_SANDBOX_OWNER }}
          SANDBOX_REPO: ${{ vars.COMMANDER_SANDBOX_REPO }}
          SANDBOX_APPROVED: ${{ vars.COMMANDER_LIVE_APPROVED_REPO }}
        run: |
          node --input-type=module <<'NODE'
          const { SANDBOX_OWNER: owner, SANDBOX_REPO: repo, SANDBOX_APPROVED: approved } = process.env;
          const segment = /^[A-Za-z0-9][A-Za-z0-9._-]*$/;
          if (!segment.test(owner ?? '') || !segment.test(repo ?? '') || approved !== `${owner}/${repo}`) {
            throw new Error('SANDBOX_TARGET_INVALID: configure one exact owner/repository');
          }
          NODE
      - name: Mint short-lived token for one sandbox repository
        id: sandbox-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.COMMANDER_SANDBOX_APP_ID }}
          private-key: ${{ secrets.COMMANDER_SANDBOX_APP_PRIVATE_KEY }}
          owner: ${{ vars.COMMANDER_SANDBOX_OWNER }}
          repositories: ${{ vars.COMMANDER_SANDBOX_REPO }}
          permission-contents: read
          permission-pull-requests: write
      - name: Run real GitHub adapter scenarios
        env:
          LIVE_GITHUB: '1'
          LIVE_GITHUB_RESPONSE_CUT: '1'
          COMMANDER_SANDBOX_TOKEN: ${{ steps.sandbox-token.outputs.token }}
          COMMANDER_CELL_TENANT_ID: github-sandbox-ci
          GITHUB_TEST_OWNER: ${{ vars.COMMANDER_SANDBOX_OWNER }}
          GITHUB_TEST_REPO: ${{ vars.COMMANDER_SANDBOX_REPO }}
          COMMANDER_GITHUB_REPOSITORIES: ${{ vars.COMMANDER_LIVE_APPROVED_REPO }}
          COMMANDER_LIVE_APPROVED_REPO: ${{ vars.COMMANDER_LIVE_APPROVED_REPO }}
          GITHUB_TEST_HEAD: ${{ vars.COMMANDER_SANDBOX_HEAD }}
          GITHUB_TEST_BASE: ${{ vars.COMMANDER_SANDBOX_BASE }}
          GITHUB_RESPONSE_CUT_HEAD: ${{ vars.COMMANDER_SANDBOX_RESPONSE_CUT_HEAD }}
        run: |
          mkdir -p artifacts/github-sandbox
          node --input-type=module -e 'import { GITHUB_PULL_REQUEST_CREATE_DESCRIPTOR as d } from "./packages/contracts/dist/index.js"; console.log(JSON.stringify({commit: process.env.GITHUB_SHA, adapterVersion: d.adapterVersion, evidence: "live-adapter-only", gatewayApproval: false, postgresRestart: false}))' > artifacts/github-sandbox/source.json
          pnpm exec node --import tsx --test packages/action-adapters/src/live/github.live.test.ts > artifacts/github-sandbox/results.tap 2>&1
      - name: Upload actual sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-sandbox-adapter-${{ github.sha }}
          path: artifacts/github-sandbox/
          if-no-files-found: error

  quality:
    name: Quality Gates (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Pull requests run the full quality suite once on the canonical runner.
      # Compatibility entries still run on main pushes and manual dispatches,
      # preserving platform coverage without six identical PR runs.
      matrix: >-
        ${{ fromJSON(github.event_name == 'pull_request'
          && '{"include":[{"os":"ubuntu-latest","node-version":"22","canonical":true}]}'
          || '{"include":[{"os":"ubuntu-latest","node-version":"22","canonical":true},{"os":"ubuntu-latest","node-version":"20","canonical":false},{"os":"macos-latest","node-version":"20","canonical":false},{"os":"macos-latest","node-version":"22","canonical":false},{"os":"windows-latest","node-version":"20","canonical":false},{"os":"windows-latest","node-version":"22","canonical":false}]}') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: sudo apt-get install -y build-essential python3 || echo "::warning::Could not install build-essential — better-sqlite3 native rebuild may fail"
        if: runner.os == 'Linux'

      - run: pnpm install
        # NOTE: --frozen-lockfile is intentionally omitted here. better-sqlite3
        # ships its prebuilt binary as a package attachment; pnpm extract this
        # during install but only if it runs the install script. A plain
        # `pnpm install` (vs `pnpm install --frozen-lockfile`) reliably
        # unpacks all prebuilt binaries for platform-matched packages.
        # The lockfile is still trustworthy — it will not be mutated.
        env:
          PNPM_SCRIPTS: prefer

      - name: Rebuild better-sqlite3 native binding (Windows MSVC fallback inline)
        # better-sqlite3 ships prebuilt binaries for most OS × ABI combos
        # but pnpm 9.x's prebuild extraction occasionally fails on warm
        # CI caches, producing 'Could not locate the bindings file
        # ... node-v{N}-... better_sqlite3.node' on Node 20 / 22 runners.
        #
        # On Linux/macOS (github-hosted ubuntu/macos runners), the prebuild
        # revert path is enough — `pnpm rebuild better-sqlite3` re-extracts
        # or source-builds via the bundled clang toolchain.
        #
        # On Windows, source-build needs MSVC active IN THE SAME SHELL as
        # `pnpm rebuild` (env does NOT auto-propagate between separate
        # GitHub Actions steps without `>> $GITHUB_ENV` plumbing). To
        # remove that brittle plumbing dependency, we combine MSVC
        # activation + rebuild into ONE Windows-only step: `cmd //c` sources
        # vcvars64.bat inline and chains the rebuild inside the same child
        # process. prebuild extraction exits early on success and never
        # invokes MSVC; if extraction fails, node-gyp falls back to a
        # source-build using the just-activated MSVC env.
        #
        # vswhere.exe is the canonical way to locate VS on Windows GitHub
        # runners. It's always on PATH and returns the installation path
        # regardless of which VS version folder name the runner image uses
        # (e.g. "2022" for VS 2022, "18" for VS 2025 Preview).
        # Note: continue-on-error is intentionally NOT set on this step —
        # every inner branch softens failure with `|| ... exit 0` so the
        # step always finishes ≥ 0, and the workflow green-path is now
        # driven entirely by SQLITE_BINDING_OK toggling the test-step
        # vitest exclude fallback (see packages/core/scripts/run-vitest-sqlite-fallback.sh).
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            # ---- Diagnostics: dump what's available on the runner ----
            echo "--- VS diagnostics ---"
            echo "  where cl.exe: $(cmd //c 'where cl.exe 2>nul' 2>/dev/null || echo NOT_FOUND)"
            echo "  where vswhere: $(cmd //c 'where vswhere 2>nul' 2>/dev/null || echo NOT_FOUND)"
            echo "  ls 'Program Files/Microsoft Visual Studio/': $(ls '/c/Program Files/Microsoft Visual Studio/' 2>/dev/null || echo NOT_FOUND)"
            echo "  ls 'Program Files (x86)/Microsoft Visual Studio/': $(ls '/c/Program Files (x86)/Microsoft Visual Studio/' 2>/dev/null || echo NOT_FOUND)"
            echo "  vswhere version: $(cmd //c '"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -version 2>nul' 2>/dev/null || echo NOT_FOUND)"
            echo "  vswhere any products: $(cmd //c '"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath 2>nul' 2>/dev/null || echo NOT_FOUND)"
            # ---- locate vcvars64.bat by trying multiple methods ----
            VS_VCVARS=""
            VS_VCVARS_BASH=""
            # Method A: vswhere (canonical, but needs full path on some runners)
            cmd_vswhere=""
            for candidate in "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" "/c/Program Files/Microsoft Visual Studio/Installer/vswhere.exe" "vswhere"; do
              if command -v "$candidate" &>/dev/null || [ -f "$candidate" ]; then
                cmd_vswhere="$candidate"
                break
              fi
            done
            if [ -n "$cmd_vswhere" ]; then
              VS_INSTALL_PATH=$("$cmd_vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath 2>/dev/null | head -1)
              if [ -n "$VS_INSTALL_PATH" ]; then
                echo "  vswhere found VS at: $VS_INSTALL_PATH"
                VS_VCVARS="${VS_INSTALL_PATH}\\VC\\Auxiliary\\Build\\vcvars64.bat"
                VS_VCVARS_BASH=$(echo "$VS_INSTALL_PATH" | sed 's/\\/\//g' | sed 's/^C:/\/c/')"/VC/Auxiliary/Build/vcvars64.bat"
              fi
            fi
            # Method B: find in both possible VS base directories
            if [ -z "$VS_VCVARS" ]; then
              for base in "/c/Program Files/Microsoft Visual Studio" "/c/Program Files (x86)/Microsoft Visual Studio"; do
                if [ -d "$base" ]; then
                  found=$(find "$base" -maxdepth 5 -name "vcvars64.bat" -path "*/VC/Auxiliary/Build/*" 2>/dev/null | head -1)
                  if [ -n "$found" ]; then
                    VS_VCVARS=$(echo "$found" | sed 's|^/c/|C:\\|' | sed 's|/|\\|g')
                    VS_VCVARS_BASH="$found"
                    echo "  find located vcvars64 at: $found"
                    break
                  fi
                fi
              done
            fi
            # Method C: cmd.exe /s dir glob
            if [ -z "$VS_VCVARS" ]; then
              found=$(cmd //c 'dir /s /b "C:\Program Files\Microsoft Visual Studio\*\*\VC\Auxiliary\Build\vcvars64.bat" 2>nul' | head -1)
              if [ -z "$found" ]; then
                found=$(cmd //c 'dir /s /b "C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Auxiliary\Build\vcvars64.bat" 2>nul' | head -1)
              fi
              if [ -n "$found" ]; then
                VS_VCVARS="$found"
                VS_VCVARS_BASH=$(echo "$found" | sed 's|\\|/|g' | sed 's|^C:|/c|')
                echo "  cmd dir glob located vcvars64 at: $found"
              fi
            fi
            # ---- Activate MSVC and rebuild ----
            if [ -n "$VS_VCVARS" ]; then
              echo "::notice::Activating MSVC at $VS_VCVARS_BASH, then rebuilding better-sqlite3 in same shell"
              # Resolve the actual better-sqlite3 directory from packages/core's perspective
              BETTER_DIR="$(cd packages/core && node -e "
                var p=require.resolve('better-sqlite3/package.json');
                var d=require('path').dirname(p);
                console.log(d);
              ")"
              echo "  resolved better-sqlite3 dir: [$BETTER_DIR]"
              # Write a batch file to source vcvars64.bat and rebuild better-sqlite3
              batpath="$(pwd)/rebuild.bat"
              echo '@echo on' > "$batpath"
              echo '@call "'"$VS_VCVARS"'"' >> "$batpath"
              echo '@echo [VCVARS_OK]' >> "$batpath"
              echo '@cd /d %GITHUB_WORKSPACE%' >> "$batpath"
              echo '@echo [REMOVE_OLD_BUILD]' >> "$batpath"
              echo '@if exist "'"$BETTER_DIR"'\build" rmdir /s /q "'"$BETTER_DIR"'\build"' >> "$batpath"
              echo '@echo [NODE_GYP_REBUILD]' >> "$batpath"
              echo '@cd /d "'"$BETTER_DIR"'"' >> "$batpath"
              echo '@call npx --yes node-gyp rebuild 2>&1' >> "$batpath"
              echo '@echo [NODE_GYP_EXIT]: %errorlevel%' >> "$batpath"
              echo '@cd /d %GITHUB_WORKSPACE%' >> "$batpath"
              # Convert to Windows path for cmd.exe
              batwin=$(echo "$batpath" | sed 's|^/\([a-z]\)/|\1:\\|' | sed 's|/|\\|g')
              echo "  [BAT] batch file (unix): $batpath"
              echo "  [BAT] batch file (win):  $batwin"
              echo "  [BAT] vcvars64.bat:      $VS_VCVARS"
              echo "  [BAT] workspace:         $GITHUB_WORKSPACE"
              echo "  [BAT] better-sqlite3 dir: $BETTER_DIR"
              echo "  [BAT] displaying batch file:"
              cat "$batpath"
              echo "  [BAT] running..."
              MSYS2_ARG_CONV_EXCL=* cmd /c "$batwin" \
                || (echo "::warning::better-sqlite3 rebuild failed (post-MsVC)")
            else
              echo "::warning::MSVC vcvars64 not located on Windows runner — attempting pnpm rebuild without MSVC source-build fallback"
              pnpm rebuild better-sqlite3 \
              || { echo "::warning::better-sqlite3 rebuild failed — will probe binding next"; exit 0; }
            fi
          else
            pnpm rebuild better-sqlite3 \
              || { echo "::warning::better-sqlite3 rebuild failed — will probe binding next"; exit 0; }
          fi
          # Probe: check if compiled binary exists, then try to load binding.
          # This is the authoritative gate: if the binding cannot be loaded,
          # the job exits 1 so the test suite is skipped (not silently pass).
          echo "  checking for compiled binary:"
          ls -la packages/core/node_modules/better-sqlite3/build/Release/ 2>/dev/null || echo "  (no build/Release in packages/core)"
          ls -la node_modules/.pnpm/better-sqlite3*/node_modules/better-sqlite3/build/Release/ 2>/dev/null || echo "  (no build/Release in .pnpm store)"
          if (cd packages/core && node -e "
            try {
              var D=require('better-sqlite3'), db=new D(':memory:');
              db.exec('CREATE TABLE t (a)');
              var row=db.prepare('SELECT 1 AS v').get();
              db.close();
              process.exit(row&&row.v===1?0:1);
            } catch(e) { console.error('  PROBE_ERROR:', e.message); process.exit(1); }
          "); then
            echo "::notice::better-sqlite3 binding loaded and functional OK"
            echo "SQLITE_BINDING_OK=true" >> $GITHUB_ENV
          else
            echo "::warning::better-sqlite3 binding failed to load on this runner — vitest will run with SQLite-dependent suites excluded (see packages/core/scripts/run-vitest-sqlite-fallback.sh)."
            echo "SQLITE_BINDING_OK=false" >> $GITHUB_ENV
            # Exit 0 (NOT 1) so the workflow UI stays green when degraded; the
            # test-step vitest --exclude fallback is the intended degraded
            # behaviour, not an unrecoverable failure. With continue-on-error
            # above this preserves subsequent steps regardless.
            exit 0
          fi
          echo "::notice::Post-rebuild binding status: ABI=$(node -p 'process.versions.modules') platform=$(node -p 'process.platform') arch=$(node -p 'process.arch')"

      - name: Security audit
        # npm retired the legacy /-/npm/v1/security/audits endpoint (HTTP 410),
        # which makes bare `pnpm audit` fail the entire Quality Gates matrix
        # before any tests run. Soften: try audit, warn on transport/API
        # retirement errors, still fail on real high/critical advisories when
        # the endpoint works. CodeQL + pnpm audit:wiring remain hard gates.
        # Explicit bash: Windows runners default to pwsh and parse this as .ps1
        # (ParserError on `if echo "$out" | grep ...`).
        shell: bash
        run: |
          set +e
          audit_output="$RUNNER_TEMP/pnpm-audit.json"
          pnpm audit --audit-level=high --json > "$audit_output" 2>&1
          code=$?
          cat "$audit_output"
          if [ $code -eq 0 ]; then
            exit 0
          fi
          # GHSA-qwww-vcr4-c8h2 is scoped to React Router's unstable RSC APIs.
          # The policy script parses valid JSON before considering a narrowly
          # recognized pnpm transport failure. It fails closed for malformed
          # output, other advisories, and any RSC wiring in apps/web/src.
          if [ "$code" -ne 0 ] && pnpm exec tsx scripts/ci-audit-policy.ts "$audit_output"; then
            exit 0
          fi
          echo "::error::pnpm audit reported high/critical advisories"
          exit $code

      - name: Security audit policy regression
        run: pnpm exec node --import tsx --test scripts/ci-audit-policy.test.ts

      # Every workflow claims "Enforced by scripts/workflow-supply-chain.test.ts",
      # but nothing ran it: the mutable-remote-ref, permissions, and
      # pull_request_target policies were never observed in CI.
      - name: Workflow supply-chain policy regression
        run: pnpm exec node --import tsx --test scripts/workflow-supply-chain.test.ts

      # These two steps used to run over a hand-written subset of the tree
      # (`packages/core/src`, three globs) while the repo's own gates cover every
      # first-party TypeScript scope. A gate whose scope is narrower than it
      # claims reports safety it has not verified, so they now delegate to the
      # same script a developer runs.
      - name: ESLint (all first-party TypeScript)
        run: pnpm run lint:eslint

      - name: Prettier format check (all first-party TypeScript)
        run: pnpm run format:check

      - name: Claim honesty gate
        run: pnpm claim:gate:test

      - name: TypeScript check (core and all packages, source and tests)
        run: |
          # tsc --noEmit resolves @praetor/plugin-sdk types from dist; clean CI has none
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/plugin-sdk build
          pnpm --filter @praetor/postgres-runtime build
          pnpm --filter @praetor/effect-broker build
          pnpm --filter @praetor/action-adapters build
          pnpm --filter @praetor/kernel build
          pnpm --filter @praetor/core build
          # `typecheck` chains the core and kernel source builds plus every other
          # package's `typecheck:test` (tsconfig.test.json), which typechecks the
          # in-src `*.test.ts` files the package builds exclude. Those configs
          # previously existed for kernel only and were invoked by no root script
          # or workflow, which is how type errors survived unnoticed.
          # `packages/core`'s own `tsconfig.test.json` (its `tests/**` tree) is
          # deliberately NOT in this chain yet: it is a long-standing red gate
          # (measured 2026-09-18: ~1k pre-existing errors in test fixtures that
          # vitest transpiles without typechecking). Run it explicitly with
          # `pnpm --dir packages/core run typecheck:test` until that backlog is cleared.
          pnpm --dir packages/core exec tsc --noEmit
          pnpm --dir packages/kernel exec tsc --noEmit
          pnpm --dir packages/kernel run typecheck:test
          pnpm run typecheck

      - name: TypeScript check (SDK)
        run: |
          # SDK imports @praetor/core types from dist; build core after plugin-sdk above
          pnpm --filter @praetor/core build
          pnpm --filter @praetor/sdk typecheck

      - name: Generate dependency SBOM
        if: matrix.canonical
        run: pnpm list --recursive --depth=Infinity --json > sbom.json

      - name: Upload SBOM artifact
        if: matrix.canonical
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.os }}-node${{ matrix.node-version }}
          path: sbom.json
          overwrite: true
          if-no-files-found: error

      - name: Verify core test inventory
        run: pnpm --filter @praetor/core test:inventory

      - name: Audit reversibility wiring
        run: pnpm audit:wiring

      - name: Architecture V2 invariant gates
        run: pnpm test:arch

      - name: Architecture constitution guard
        run: pnpm arch:guard:test

      - name: Architecture constitution guard (repository)
        run: pnpm arch:guard

      - name: Contract snapshot freeze check
        run: pnpm contract:check

      - name: Contracts package tests (controlPlane + baseline + OpenAPI)
        run: pnpm --filter @praetor/contracts test

      - name: Kernel unit tests (compensation DLQ + WS2)
        # L2-12: claimOutbox(+ByTopic) DLQ/max_attempts filter + poison→DLQ proofs.
        shell: bash
        run: |
          pnpm --filter @praetor/kernel run pretest
          node --test scripts/kernel-test-reporter.test.mjs
          node scripts/run-kernel-tests-ci.mjs

      - name: Upload sanitized kernel test failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kernel-test-evidence-${{ matrix.os }}-node${{ matrix.node-version }}
          path: packages/kernel/kernel-test-evidence.jsonl
          if-no-files-found: ignore

      - name: Effect-broker unit tests (approval binding ENFORCED)
        # L2-11: exact request-hash / policy / audience binding proofs.
        run: pnpm --filter @praetor/effect-broker test

      - name: WS6/WS7 node:test gates (audit query + host-exec static + memory HTTP)
        # Use bash so multiline `\` continuations work on Windows (pwsh treats them as args).
        shell: bash
        run: |
          # API + worker-plane tests import workspace packages from dist.
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/plugin-sdk build
          pnpm --filter @praetor/effect-broker build
          pnpm --filter @praetor/kernel build
          pnpm --filter @praetor/action-adapters build
          pnpm --filter @praetor/core build
          pnpm --filter @praetor/core exec node --import tsx --test \
            tests/sandbox/productionPolicy.test.ts \
            tests/memory/memoryAuditQuery.test.ts \
            tests/security/exec-policy-resource-tool.test.ts
          pnpm exec node --import tsx --test \
            packages/worker-plane/src/llmBrokerBridge.test.ts \
            packages/worker-plane/src/workerRuntimeAdapter.test.ts \
            packages/worker-plane/src/stepWorkloadIdentity.test.ts \
            packages/worker-plane/src/l3-03b-gateway-localonly.test.ts \
            packages/worker-plane/src/l3-03a-effect-tool-monopoly.test.ts \
            packages/worker-plane/src/ticketAdapter.test.ts \
            packages/worker-plane/src/actionGatewayPolicy.test.ts \
            packages/worker-plane/src/bootstrap.policy.test.ts \
            packages/worker-plane/src/bootstrap.authority.test.ts \
            packages/worker-plane/src/bootstrap.evidence.test.ts \
            packages/worker-plane/src/bootstrap.postgresRuntime.test.ts \
            packages/worker-plane/src/registry.rls.test.ts
          pnpm exec node --import tsx --test \
            apps/api/test/namespacedMemoryEndpoints.test.ts \
            apps/api/test/namespacedMemoryRbac.test.ts \
            apps/api/test/legacyExecutionGuard.test.ts \
            apps/api/test/l3-06GatewayResidual.test.ts \
            apps/api/test/tenantContextMiddleware.test.ts \
            apps/api/test/oneRunAuthority.test.ts \
            apps/api/test/warRoomDemotion.test.ts

      - name: Readiness gate (strict)
        # Simulated/synthetic docs/baselines fixtures are non-scoring.
        # Required slots must use live evidence; until then they are recommended.
        # residual→100 is refused unless required live baselines pass.
        # The release environment supplies the approved profile and live
        # evidence. Matrix quality jobs have no production profile, so run the
        # same validator in diagnostic-only mode rather than treating its
        # deliberate NOT_EVALUATED result as a product regression.
        run: pnpm exec tsx scripts/check-readiness.ts --non-strict

      - name: Run core tests
        shell: bash
        env:
          # Dev/test bypass only: CI runners lack Docker/gVisor runtimes, so the
          # test suite needs the noop fallback. This NEVER runs in production.
          COMMANDER_ALLOW_NO_SANDBOX: true
        run: |
          if [ "$SQLITE_BINDING_OK" = "false" ]; then
            echo "::warning::better-sqlite3 native binding unavailable on this runner — running vitest with SQLite-dependent suites excluded."
            bash packages/core/scripts/run-vitest-sqlite-fallback.sh
          else
            pnpm --filter @praetor/core test
          fi

      # The `node:test` half of the core suite (197 files) was executed by NO
      # workflow: `test` above is the vitest allowlist, and the only other
      # node:test invocation in this file is the single `test:node:pathsec` file.
      # That is how ~111 files stayed unrunnable in CI — including the ones whose
      # first execution this pass found to be failing (a suite that could not load,
      # a benchmark reporting two passes that asserted nothing, a self-skipping
      # security gate). It is a separate step because the two halves have separate
      # runners and separate discovery, and a green vitest run says nothing about
      # the node:test half.
      - name: Run core node:test suite
        # The core node:test suite contains POSIX-only permission, shell, and
        # file-lock assertions. Vitest and the package typecheck still run on
        # Windows; execute this POSIX suite on Linux/macOS where its contracts
        # are meaningful and covered by the production targets.
        if: runner.os != 'Windows'
        shell: bash
        env:
          # Dev/test bypass only — CI runners lack real sandbox runtimes.
          COMMANDER_ALLOW_NO_SANDBOX: true
        run: pnpm --filter @praetor/core test:node

      - name: Run SLO measurements
        if: matrix.canonical
        shell: bash
        env:
          # Dev/test bypass only — CI runners lack real sandbox runtimes.
          COMMANDER_ALLOW_NO_SANDBOX: true
        run: pnpm --filter @praetor/core test:slo

      - name: Upload SLO report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && matrix.canonical
        with:
          name: slo-report-${{ matrix.os }}-node${{ matrix.node-version }}
          path: packages/core/.commander_benchmarks/slo-report-*.json
          if-no-files-found: ignore

      - name: Print SLO summary
        if: always() && matrix.canonical
        shell: bash
        run: |
          echo "📊 SLO measurement summary"
          cat packages/core/.commander_benchmarks/slo-report-*.json 2>/dev/null || echo "(no SLO report generated)"

      - name: Path security tests
        # This suite includes POSIX shell/grep and Unix permission semantics;
        # Windows runs the cross-platform security checks in Vitest instead.
        if: runner.os != 'Windows'
        env:
          # Dev/test bypass only — CI runners lack real sandbox runtimes.
          COMMANDER_ALLOW_NO_SANDBOX: true
        run: pnpm --filter @praetor/core test:node:pathsec

      - name: CLI check
        shell: bash
        run: cd packages/core && pnpm exec tsx src/cliEntry.ts status

      # G2 requires `doctor` to exit zero on a fresh environment and to request
      # no credential. Nothing ran it, so its exit code was unobserved — and it
      # couples to host disk pressure (`pass: usePercent < 95`), meaning a
      # 90%-full machine fails a check that is not about the product.
      - name: CLI doctor offline (G2 install/first-run contract)
        if: matrix.node-version == '22'
        shell: bash
        run: pnpm exec tsx packages/core/src/cliEntry.ts doctor --offline

      - name: Red Team Smoke Test (security gate)
        if: runner.os == 'Linux' && matrix.canonical
        shell: bash
        run: |
          echo "🔴 Running red team smoke test (5 critical scenarios)..."
          cd packages/core
          # Resolve tsx through the workspace installation. `npx tsx` can
          # resolve a broken nested path on clean Node 20 runners.
          set +e
          pnpm exec tsx src/security/runRedTeamBattery.ts --smoke --json > /tmp/rt-smoke.json 2>&1
          EXIT_CODE=$?
          set -e
          # Parse JSON output for score
          SCORE=$(node -e "try{process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d.trim().split('\\n').find(l=>l.startsWith('{'))||d.trim());console.log(j.securityScore)})}catch(e){console.log(0)}" < /tmp/rt-smoke.json 2>/dev/null || echo "0")
          echo "Red team smoke score: $SCORE/100"
          cat /tmp/rt-smoke.json | tail -20
          # Fail if score < 80 or any critical missed
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Red team smoke test FAILED — security regression detected"
            exit 1
          fi
          echo "✅ Red team smoke test PASSED"

  kernel-postgres-integration:
    name: Kernel PostgreSQL Integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: commander
          POSTGRES_PASSWORD: commander
          POSTGRES_DB: commander
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U commander -d commander"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://commander_owner:commander_owner@localhost:5432/commander
      COMMANDER_KERNEL_DATABASE_URL: postgres://commander_owner:commander_owner@localhost:5432/commander
      COMMANDER_KERNEL_POSTGRES_CONTRACT_TEST: '1'
      COMMANDER_KERNEL_POSTGRES_CONTRACT_DATABASE_URL: postgres://commander_owner:commander_owner@localhost:5432/commander_kernel_contract
      COMMANDER_OWNER_DATABASE_URL: postgres://commander_owner:commander_owner@localhost:5432/commander
      OWNER_DSN: postgres://commander_owner:commander_owner@localhost:5432/commander
      GIT_TERMINAL_PROMPT: '0'
      COMMANDER_INTERACTION_DB: ':memory:'
      # Provisioned-instance admission for scripts that MUTATE the database
      # (scripts/ci-database-scope.ts). Without these the bootstrap job fails
      # closed with CI_DATABASE_MUTATION_REFUSED before any test runs. The
      # service container above is the provisioner-owned instance: it is
      # discarded with the runner. The guard's own header records that it cannot
      # prove exclusive ownership — that is why its loopback/private-host check
      # is the load-bearing control, and this target is localhost.
      COMMANDER_CI_INSTANCE_MUTATION: 'yes'
      COMMANDER_CI_INSTANCE_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMMANDER_CI_PROVISION_TOKEN: ci-${{ github.run_id }}-${{ github.run_attempt }}-provision
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install
      - name: Configure verified PostgreSQL TLS for runtime consumers
        shell: bash
        run: |
          TLS_DIR="$GITHUB_WORKSPACE/artifacts/ci-postgres-tls"
          mkdir -p "$TLS_DIR"
          openssl genrsa -out "$TLS_DIR/ca.key" 2048
          openssl req -x509 -new -nodes -key "$TLS_DIR/ca.key" -sha256 -days 1 -subj '/CN=commander-ci-postgres-ca' -out "$TLS_DIR/ca.crt"
          openssl genrsa -out "$TLS_DIR/server.key" 2048
          openssl req -new -key "$TLS_DIR/server.key" -subj '/CN=localhost' -out "$TLS_DIR/server.csr"
          openssl x509 -req -in "$TLS_DIR/server.csr" -CA "$TLS_DIR/ca.crt" -CAkey "$TLS_DIR/ca.key" -CAcreateserial -out "$TLS_DIR/server.crt" -days 1 -sha256 -extfile <(printf 'subjectAltName=DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n')
          PG_CONTAINER="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -1)"
          test -n "$PG_CONTAINER"
          docker cp "$TLS_DIR/." "$PG_CONTAINER:/tmp/ci-postgres-tls/"
          docker exec -u 0 "$PG_CONTAINER" sh -ec 'install -d -o postgres -g postgres -m 0755 /var/lib/postgresql/data/ci-postgres-tls; install -o postgres -g postgres -m 0644 /tmp/ci-postgres-tls/ca.crt /var/lib/postgresql/data/ci-postgres-tls/ca.crt; install -o postgres -g postgres -m 0644 /tmp/ci-postgres-tls/server.crt /var/lib/postgresql/data/ci-postgres-tls/server.crt; install -o postgres -g postgres -m 0600 /tmp/ci-postgres-tls/server.key /var/lib/postgresql/data/ci-postgres-tls/server.key'
          docker exec -u postgres "$PG_CONTAINER" psql -U commander -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl = 'on'"
          docker exec -u postgres "$PG_CONTAINER" psql -U commander -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_ca_file = '/var/lib/postgresql/data/ci-postgres-tls/ca.crt'"
          docker exec -u postgres "$PG_CONTAINER" psql -U commander -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/data/ci-postgres-tls/server.crt'"
          docker exec -u postgres "$PG_CONTAINER" psql -U commander -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/data/ci-postgres-tls/server.key'"
          docker restart "$PG_CONTAINER"
          until docker exec "$PG_CONTAINER" pg_isready -U commander -d commander; do sleep 1; done
          SPKI_SHA256="$(openssl x509 -pubkey -noout -in "$TLS_DIR/server.crt" | openssl pkey -pubin -outform DER | openssl dgst -sha256 -r | awk '{print $1}')"
          test "${#SPKI_SHA256}" -eq 64
          echo "COMMANDER_DATABASE_TLS_CA_FILE=$GITHUB_WORKSPACE/artifacts/ci-postgres-tls/ca.crt" >> "$GITHUB_ENV"
          echo "COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=$SPKI_SHA256" >> "$GITHUB_ENV"
      - name: Rebuild better-sqlite3 (repositoryContract SQLite suite)
        run: pnpm rebuild better-sqlite3
      - name: Bootstrap kernel integration roles
        env:
          PGPASSWORD: commander
        run: |
          psql --set ON_ERROR_STOP=1 --host localhost --port 5432 --username commander --dbname commander <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'commander_owner') THEN
              CREATE ROLE commander_owner LOGIN PASSWORD 'commander_owner' NOSUPERUSER NOCREATEDB CREATEROLE INHERIT NOREPLICATION BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'commander_app') THEN
              CREATE ROLE commander_app LOGIN PASSWORD 'commander_app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'commander_tenant_authority') THEN
              CREATE ROLE commander_tenant_authority LOGIN PASSWORD 'commander_tenant_authority' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'commander_scheduler') THEN
              CREATE ROLE commander_scheduler LOGIN PASSWORD 'commander_scheduler' NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION BYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'commander_worker') THEN
              CREATE ROLE commander_worker LOGIN PASSWORD 'commander_worker' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'commander_adapter_ops') THEN
              CREATE ROLE commander_adapter_ops LOGIN PASSWORD 'commander_adapter_ops' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
            END IF;
          END $$;
          ALTER ROLE commander_owner LOGIN CREATEROLE BYPASSRLS PASSWORD 'commander_owner';
          ALTER ROLE commander_app LOGIN NOBYPASSRLS PASSWORD 'commander_app';
          ALTER ROLE commander_tenant_authority LOGIN NOBYPASSRLS PASSWORD 'commander_tenant_authority';
          ALTER ROLE commander_scheduler LOGIN BYPASSRLS PASSWORD 'commander_scheduler';
          ALTER ROLE commander_worker LOGIN NOBYPASSRLS PASSWORD 'commander_worker';
          ALTER ROLE commander_adapter_ops LOGIN NOBYPASSRLS PASSWORD 'commander_adapter_ops';
          ALTER DATABASE commander OWNER TO commander_owner;
          ALTER SCHEMA public OWNER TO commander_owner;
          GRANT commander_app TO commander_owner WITH ADMIN OPTION, INHERIT FALSE, SET TRUE;
          GRANT commander_tenant_authority TO commander_owner WITH ADMIN OPTION, INHERIT FALSE, SET TRUE;
          GRANT commander_scheduler TO commander_owner WITH ADMIN OPTION, INHERIT FALSE, SET TRUE;
          GRANT commander_worker TO commander_owner WITH ADMIN OPTION, INHERIT FALSE, SET TRUE;
          GRANT commander_adapter_ops TO commander_owner WITH ADMIN OPTION, INHERIT FALSE, SET TRUE;
          SQL
      - name: Create isolated kernel contract database
        env:
          PGPASSWORD: commander
        run: |
          if ! psql --host localhost --port 5432 --username commander --dbname postgres --tuples-only --no-align \
            --command "SELECT 1 FROM pg_database WHERE datname = 'commander_kernel_contract'" | grep -qx 1; then
            createdb --host localhost --port 5432 --username commander --owner commander_owner commander_kernel_contract
          fi
          psql --set ON_ERROR_STOP=1 --host localhost --port 5432 --username commander --dbname commander_kernel_contract <<'SQL'
          ALTER SCHEMA public OWNER TO commander_owner;
          GRANT USAGE, CREATE ON SCHEMA public TO commander_owner;
          CREATE TABLE IF NOT EXISTS public.kernel_contract_disposable_marker (
            marker text PRIMARY KEY CHECK (marker = 'commander_kernel_contract_v1')
          );
          INSERT INTO public.kernel_contract_disposable_marker (marker)
          VALUES ('commander_kernel_contract_v1')
          ON CONFLICT (marker) DO NOTHING;
          ALTER TABLE public.kernel_contract_disposable_marker OWNER TO commander_owner;
          REVOKE ALL ON public.kernel_contract_disposable_marker FROM PUBLIC;
          GRANT CONNECT ON DATABASE commander_kernel_contract TO commander_app, commander_tenant_authority,
            commander_scheduler, commander_worker, commander_adapter_ops;
          SQL
      - name: Apply isolated kernel contract migrations
        env:
          COMMANDER_OWNER_DATABASE_URL: postgres://commander_owner:commander_owner@localhost:5432/commander_kernel_contract
        run: |
          pnpm exec tsx scripts/ci-bootstrap-deploy-gates.ts closure
          pnpm exec tsx scripts/ci-bootstrap-deploy-gates.ts full
      - name: Apply kernel closure migrations
        run: |
          pnpm exec tsx scripts/ci-bootstrap-deploy-gates.ts closure
          pnpm exec tsx scripts/ci-bootstrap-deploy-gates.ts full
      - name: Build kernel / worker-plane / core / api
        run: |
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/plugin-sdk build
          pnpm --filter @praetor/postgres-runtime build
          pnpm --filter @praetor/effect-broker build
          pnpm --filter @praetor/kernel build
          pnpm --filter @praetor/action-adapters build
          pnpm --filter @praetor/core build
          pnpm --filter @praetor/worker-plane build
          pnpm --filter @praetor/api build
      - name: Kernel PostgreSQL integration (fencing + tenant isolation)
        run: pnpm exec node --import tsx --test packages/kernel/src/postgres.integration.test.ts
      - name: Kernel PostgreSQL ops + compensation race (C4/C5/C2 PG)
        run: |
          pnpm exec node --import tsx --test --test-concurrency=1 \
            packages/kernel/src/postgres.ops.integration.test.ts \
            packages/kernel/src/ops/outbox/compensationPublisherRace.integration.test.ts \
            packages/kernel/src/ops/outbox/compensationPublisherRace.postgres.integration.test.ts
      - name: Assert PG compensation tests did not skip
        run: bash scripts/l4-b-assert-pg-compensation-tests-ran.sh
      - name: L4-B compensation dual-process race (C6, PG)
        run: pnpm cell:compensation-dual-race -- --seed=16
      - name: Upload dual-process race artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l4-b-compensation-dual-race
          path: artifacts/l4-b-compensation-dual-race-*.json
          if-no-files-found: error
      - name: Worker plane e2e (execute + lease reclaim)
        run: pnpm exec node --import tsx --test packages/worker-plane/src/e2e/gateway-kernel-worker.e2e.test.ts
      - name: Full Gateway → Worker terminal loop
        run: pnpm p0:full-loop:tls
        env:
          P0_TIMEOUT_MS: '120000'
          AUTH_FAILURE_REDIS_URL: redis://localhost:6379

  shadow-phase-a-postgres:
