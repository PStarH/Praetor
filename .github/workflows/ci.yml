          } >> "$GITHUB_ENV"
          echo "COMMANDER_EVIDENCE_SIGNING_KEY_ID=cell-ci-ev-r1" >> "$GITHUB_ENV"
          ev_jwks=$(node -e "
            const { createPrivateKey, createPublicKey } = require('node:crypto');
            const priv = createPrivateKey(require('node:fs').readFileSync('$key_dir/ev.pem'));
            const jwk = createPublicKey(priv).export({ format: 'jwk' });
            process.stdout.write(JSON.stringify({ keys: [{ kty: jwk.kty, crv: jwk.crv, x: jwk.x, kid: 'cell-ci-ev-r1' }] }));
          ")
          echo "COMMANDER_EVIDENCE_JWKS_JSON=$ev_jwks" >> "$GITHUB_ENV"
          # Generate cell PostgreSQL TLS fixture. generate-certificates.sh pins
          # subjectAltName=DNS:postgres so in-network verify-full can match the service.
          sh deploy/docker/kernel-tls/generate-certificates.sh "$key_dir/db-tls" postgres
          echo "COMMANDER_DATABASE_TLS_HOST_DIR=$key_dir/db-tls" >> "$GITHUB_ENV"
          echo "COMMANDER_CELL_POSTGRES_TLS_DIR=$key_dir/db-tls" >> "$GITHUB_ENV"
          spki=$(openssl x509 -in "$key_dir/db-tls/server.crt" -pubkey -noout \
            | openssl pkey -pubin -outform DER | openssl dgst -sha256 -r | cut -d' ' -f1)
          echo "COMMANDER_DATABASE_TLS_EXPECTED_SERVER_SPKI_SHA256=$spki" >> "$GITHUB_ENV"

      - name: Docker build worker image (--no-cache)
        run: docker build --no-cache -f packages/worker-plane/Dockerfile -t commander-worker-ci .

      - name: Image boot smoke (P6 contracts/schemas in-image)
        run: pnpm cell:image-boot-smoke -- --image-tag commander-worker-ci --skip-build

      - name: Cell up assert (compose profile)
        # --keep: do not tear the stack down on failure, so the diagnostic step
        # below can actually read the containers' logs.
        run: pnpm cell:up-assert --keep

      - name: Cell compensation E2E compose (C3)
        run: pnpm cell:compensation-e2e -- --mode compose --up

      - name: GitHub recovery through real Gateway and PostgreSQL (synthetic provider)
        timeout-minutes: 15
        run: pnpm cell:github-recovery --up

      - name: Upload GitHub cell recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-cell-recovery-${{ github.sha }}
          path: artifacts/github-cell-recovery.json
          if-no-files-found: error

      # `cell:up-assert` reports which services are unhealthy but the reason is in
      # the containers. Without this, an unhealthy api/worker/adapter-ops is
      # undiagnosable from CI output.
      - name: Cell container logs (on failure)
        if: failure()
        run: |
          for svc in api worker kernel-ops adapter-ops kernel-migrate postgres; do
            echo "===== $svc ====="
            docker compose -f docker-compose.yml -f docker-compose.cell.yml \
              -f docker-compose.kernel-tls.yml --profile cell ps "$svc" || true
            docker compose -f docker-compose.yml -f docker-compose.cell.yml \
              -f docker-compose.kernel-tls.yml --profile cell logs --no-color --tail 80 "$svc" || true
          done
          docker compose -f docker-compose.yml -f docker-compose.cell.yml \
            -f docker-compose.kernel-tls.yml --profile cell down -v --remove-orphans || true

      - name: Upload cell up-assert artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l4-b-cell-up-assert
          path: artifacts/l4-b-cell-up-assert-*.json
          if-no-files-found: error

      - name: Upload cell compensation e2e artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l4-b-cell-compensation-e2e
          path: artifacts/l4-b-cell-compensation-e2e-*.json
          if-no-files-found: error

      - name: Upload image boot smoke artifacts
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l4-b-image-boot-smoke
          path: artifacts/l4-b-image-boot-smoke-*.json
          if-no-files-found: error

  web-gui:
    name: Web GUI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install
        # NOTE: Windows — same binary-extraction reason as Linux step above.

      - name: Build web GUI
        run: pnpm exec vite build
        working-directory: apps/web
        env:
          NODE_ENV: production
