name: WS7 Boot Refuse

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
# WS7 §6 Phase 3: independent CI gate for production sandbox boot-refuse.
# Intentionally separate from ci.yml so dev/test jobs may set
# COMMANDER_ALLOW_NO_SANDBOX without weakening this gate.
# Do NOT set COMMANDER_ALLOW_NO_SANDBOX in this workflow.
# pnpm version comes from root package.json packageManager (no with.version).

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  ws7-boot-refuse:
    name: WS7 production sandbox boot-refuse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build packages for worker boot-refuse
        run: |
          pnpm --filter @praetor/contracts build
          pnpm --filter @praetor/plugin-sdk build
          pnpm --filter @praetor/effect-broker build
          pnpm --filter @praetor/kernel build
          pnpm --filter @praetor/core build
          pnpm --filter @praetor/action-adapters build
          pnpm --filter @praetor/worker-plane build

      - name: Production sandbox static gate
        run: pnpm --filter @praetor/core build:production

      - name: Core production sandbox boot-refuse
        run: pnpm --filter @praetor/core exec node --import tsx --test tests/sandbox/boot-refuse.test.ts

      - name: Worker production sandbox boot-refuse
        run: pnpm exec node --import tsx --test packages/worker-plane/src/boot-refuse.test.ts
