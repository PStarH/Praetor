name: Quarterly Architecture Audit

# Supply chain: every remote `uses:` is pinned to an immutable 40-hex commit SHA.
# SHAs resolved from the upstream repositories via the GitHub API on 2026-09-17;
# the human-readable ref each SHA was resolved from is kept as a trailing comment.
# Enforced by scripts/workflow-supply-chain.test.ts.
on:
  schedule:
    - cron: '0 2 1 1,4,7,10 *'  # 1st of Jan, Apr, Jul, Oct at 02:00 UTC
  workflow_dispatch:

# Least privilege: the workflow default is read-only; any job that needs a write scope
# or an OIDC token declares it explicitly on that job.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm --filter @commander/core... build

      - name: Run quarterly audit
        run: pnpm exec tsx packages/core/src/cli/commands/audit-quarterly.ts
        env:
          COMMANDER_GAP_ENABLED: 'true'

      - name: Upload audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quarterly-audit-${{ github.run_id }}
          path: docs/audits/
          retention-days: 365
          if-no-files-found: error

      - name: Notify on open gaps
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = '.commander/gaps/registry.ndjson';
            if (!fs.existsSync(path)) return;
            const lines = fs.readFileSync(path, 'utf-8').split('\n').filter(Boolean);
            const open = lines.map(l => JSON.parse(l)).filter(g => g.status === 'open').length;
            if (open > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[quarterly-audit] ${open} open gaps detected`,
                body: `Quarterly audit detected ${open} open gaps. See artifact for details.`,
                labels: ['gap-discovery', 'quarterly-audit'],
              });
            }
